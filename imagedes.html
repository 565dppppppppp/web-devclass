<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lamborghini Urus</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fdf6ee;
    margin: 0;
    padding: 40px 20px;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    max-width: 700px;
    margin: 0 auto;
  }

  .title {
    font-weight: bold;
    font-size: 36px;
    margin: 0;
    text-align: center;
  }

  .image-row {
    display: flex;
    flex-direction: row;
    gap: 12px;
  }

  .image-row img {
    width: 280px;
    height: 280px;
    object-fit: cover;
    border-radius: 12px;
  }

  .description {
    font-size: 16px;
    text-align: center;
    line-height: 1.5;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="container">
    <h1 class="title">Lamborghini Urus</h1>

    <div class="image-row">
      <img src="lamborghini-urus-performante-black-matte-side-profile.webp" alt="Lamborghini Urus side profile">
      <img src="fa_285000000_lamborghini-urus-2018-front-view_4x.png" alt="Lamborghini Urus front view">
    </div>

    <p class="description">
      The Lamborghini Urus is a bold fusion of supercar performance and SUV practicality, delivering breathtaking speed, aggressive design, and luxurious comfort in one powerful machine.
    </p>
  </div>

</body>
</html>
