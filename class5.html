<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style>
        .wrapper {
    border: 8px solid black;
    height: 300px;
    width: 300px;
    margin: auto;
    position: relative; 
    background-image: url(JuiceXRimac.jpg);
    background-size: cover;
    background-repeat: no-repeat;

}

.box {
    background-color: whitesmoke;
    width: 50px;
    height: 50px;
    position: absolute;
    right: 50%;
    bottom: 50%;
    transform: translate(50%, 50%);
    transition: background-color 0.3s ease 0.3s,transform 1s;
}
.box:hover {
    background-color: gray;
    transform: translate(50%, 50%)scale(1.1) rotate(360deg);

}
@media(min-width:700px){
    .wrapper{
width: 300px;
    height:300px;
border: 2px solid black;
    }}    
</style>
</head>
<body>

    <div class="wrapper">
        <div class="box"></div>
    </div>

</body>
</html>
