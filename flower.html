<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Spinning Flower</title>
  <style>
    .flower {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 100px auto;
      transition: transform 1s ease;
    }

    .petal {
      position: absolute;
      width: 50px;
      height: 100px;
      background-color: pink;
      border-radius: 50%;
      top: 0;
      left: 50%;
      transform-origin: bottom center;
    }

    /* Petal colors and rotation */
    .petal:nth-child(1) { transform: rotate(0deg); background-color: red; }
    .petal:nth-child(2) { transform: rotate(45deg); background-color: orange; }
    .petal:nth-child(3) { transform: rotate(90deg); background-color: yellow; }
    .petal:nth-child(4) { transform: rotate(135deg); background-color: green; }
    .petal:nth-child(5) { transform: rotate(180deg); background-color: lightblue; }
    .petal:nth-child(6) { transform: rotate(225deg); background-color: blue; }
    .petal:nth-child(7) { transform: rotate(270deg); background-color: purple; }
    .petal:nth-child(8) { transform: rotate(315deg); background-color: pink; }
.center {
  position: absolute;
  width: 60px;
  height: 60px;
  background-color: yellow;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}



    /* Hover effect: spin + grow */
    .flower:hover {
      transform: scale(1.2) rotate(360deg);
      transition: transform 1s ease;
    }
  </style>
</head>
<body>
  <div class="flower">
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="center"></div>
  </div>
</body>
</html>
